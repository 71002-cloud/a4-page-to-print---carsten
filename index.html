<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>a4-page-to-print---carsten</title>
  </head>
  <body>
    <header class="no-print">
      <button id="btn1">1</button>
      <button id="btn2">2</button>
      <button id="btn3">3</button>
      <button id="btn4">4</button>
      <button id="btn-print">Print</button>
    </header>
    <main class="page">
      <div class="color" id="1"><div class="shape triangle" aria-label="Triangle"></div></div>
      <div class="color" id="2"><div class="shape star" aria-label="Star"></div></div>
      <div class="color" id="3"><div class="shape circle" aria-label="Circle"></div></div>
      <div class="color" id="4"><div class="shape square" aria-label="Square"></div></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
